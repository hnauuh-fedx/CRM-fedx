name: CI/CD
# verify: runs on every pull request to main and on every push to main (required check for merging).
# publish-api-image: runs only on main after verify passes; Render runs this API image.
# deploy-api: points every Render service in RENDER_DEPLOY_HOOKS at the new image.
#   Database migrations stay manual: run them before merging a change that needs them.
# The web app is deployed by deploy-web-cloudflare.yml after this workflow succeeds on main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cd-${{ github.ref }}
  # A newer push to the same pull request supersedes the old run; main runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate --workspace apps/api
      - run: npm run typecheck --workspace apps/api
      - run: npm run typecheck --workspace apps/web
      - run: npm run typecheck --workspace apps/release-controller
      - name: Backend unit tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          WEBHOOK_QUEUE_ENABLED: 'false'
        run: node --import tsx --test --test-force-exit --test-concurrency=2 $(find src -name '*.test.ts')
      - name: Frontend unit tests
        working-directory: apps/web
        run: node --import tsx --test --test-force-exit --test-concurrency=2 $(find tests -name '*.test.ts' -o -name '*.test.tsx')
      - run: npm test --workspace apps/release-controller
      - run: npm run test:integration --workspace apps/release-controller
        env:
          CONTROL_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run test:integration:operations --workspace apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
      - run: npm run test:integration:background-lifecycle --workspace apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
      - run: npm run test:integration:login-protection --workspace apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
      - run: npm run test:integration:private-files --workspace apps/api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
      - run: npm run build --workspace apps/web
  publish-api-image:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.names.outputs.image }}:${{ github.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ github.sha }}
          build-args: RELEASE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Image for Render
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ github.sha }}
          DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          {
            echo "### API image"
            echo "Set this image on the Render API service (Settings > Image > Source):"
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
  deploy-api:
    needs: publish-api-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api-render
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn about new database migrations
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          migrations=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- apps/api/prisma/migrations || true)
          if [ -n "$migrations" ]; then
            echo "::warning::This push adds database migrations. Make sure they were applied to the server database before this deploy."
            { echo "### New database migrations"; echo '```'; echo "$migrations"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Trigger Render deploy hooks
        id: deploy
        env:
          # One Render deploy hook URL per line (API and any worker using the same image).
          HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
          IMAGE: ${{ needs.publish-api-image.outputs.image }}
        run: |
          if [ -z "$HOOKS" ]; then
            echo "::notice::RENDER_DEPLOY_HOOKS is not set; skipping the Render deploy."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          encoded=$(jq -rn --arg value "$IMAGE" '$value|@uri')
          count=0
          while IFS= read -r hook; do
            hook=$(printf '%s' "$hook" | tr -d '[:space:]')
            [ -z "$hook" ] && continue
            count=$((count + 1))
            status=$(curl -sS -o /tmp/render-response.json -w '%{http_code}' -X POST "${hook}&imgURL=${encoded}")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Render deploy hook #$count failed with HTTP $status"
              cat /tmp/render-response.json
              exit 1
            fi
            echo "Render deploy hook #$count accepted."
          done <<< "$HOOKS"
          echo "triggered=true" >> "$GITHUB_OUTPUT"
          { echo "### Render deploy"; echo "Triggered $count service(s) with \`$IMAGE\`."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the API to run the new commit
        if: steps.deploy.outputs.triggered == 'true' && vars.API_READY_URL != ''
        env:
          READY_URL: ${{ vars.API_READY_URL }}
        run: |
          # Tolerate stray spaces, newlines or quotes pasted into the variable.
          READY_URL=$(printf '%s' "$READY_URL" | tr -d "[:space:]\"'\`")
          if ! printf '%s' "$READY_URL" | grep -Eq '^https?://[^/]+/'; then
            echo "::error::API_READY_URL must be a full URL such as https://<api-host>/api/ready."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            commit=$(curl -sS -m 10 "$READY_URL" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "API is live on $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $attempt: API reports '${commit:-unreachable}', waiting..."
            sleep 15
          done
          echo "::error::The API did not report commit $GITHUB_SHA within 15 minutes. Check the deploy log on Render."
          exit 1
