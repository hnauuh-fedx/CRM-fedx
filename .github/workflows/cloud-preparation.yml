name: Prepare cloud artifacts (no deployment)
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Public API URL including /api
        required: true
        type: string
      web_url:
        description: Public frontend origin
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck --workspace apps/web
      - run: npm run prepare:cloud:web
        env:
          VITE_API_URL: ${{ inputs.api_url }}
          VITE_PUBLIC_WEB_URL: ${{ inputs.web_url }}
          RELEASE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-web-${{ github.sha }}
          path: artifacts/cloud-preparation/
          if-no-files-found: error
          retention-days: 14
