name: Deploy web to Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-web-cloudflare.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace apps/web
        env:
          # Public build-time values from repository variables (Settings > Secrets and variables > Actions > Variables).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_WEB_URL: ${{ vars.VITE_PUBLIC_WEB_URL }}
          RELEASE_COMMIT: ${{ github.sha }}
      - run: npx wrangler deploy --config apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
