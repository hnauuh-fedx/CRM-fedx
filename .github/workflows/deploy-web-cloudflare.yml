name: Deploy web to Cloudflare Workers
# Deploys only after the CI/CD workflow (tests) succeeds for a push to main.
on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed CI/CD, not a newer main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace apps/web
        env:
          # Public build-time values from repository variables (Settings > Secrets and variables > Actions > Variables).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_WEB_URL: ${{ vars.VITE_PUBLIC_WEB_URL }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: npx wrangler deploy --config apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
